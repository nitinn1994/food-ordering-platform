[project]
name = "ai-service"
version = "0.0.0"
description = "Food Ordering Platform AI service (FastAPI, LangGraph). Simulated model; Commerce API tools over HTTP; no provider or memory yet."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# An application, not a library: nothing is built or installed as a package.
# pytest finds `ai_service` through `pythonpath` below.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["ai_service", "tests"]
strict = true
plugins = ["pydantic.mypy"]

# jsonschema ships no type information; it is a test-only dependency (the
# error.v1.json conformance check), so its types are not worth a stub package.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
