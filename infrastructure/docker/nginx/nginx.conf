# Reverse proxy for the production reference topology (Phase 18,
# docs/features/phase-18-production-hardening/plan.md §8, §15, AC26).
#
# The single public entry point: it terminates TLS, redirects HTTP to
# HTTPS, caps request bodies, applies per-client rate limits, and forwards
# only to apps/web. commerce-api and ai-service are never routed from here;
# the browser reaches them only through web's own same-origin proxy.
#
# Locations are case-insensitive regexes on purpose. nginx matches locations
# on the normalized, percent-decoded path but case-sensitively, while web's
# Next.js rewrites match case-insensitively — so a plain
# `location = /api/ai/v1/agent/turns` would let `/API/AI/v1/agent/turns`
# reach the agent without the agent's limit (Phase 15 security review S2).

worker_processes auto;
pid /var/run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # No version in the Server header or on error pages.
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths live on tmpfs mounts (compose.prod.yaml); the root
    # filesystem is read-only.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # One JSON line per request. $uri, not $request_uri: no query string
    # (the services log none either). The client address is kept, as the
    # only way to investigate rate-limit abuse (runbook, "Incident response").
    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream_s":"$upstream_response_time"}';
    access_log /dev/stdout json;

    # Request bounds. Both APIs refuse JSON bodies over 16 KB themselves;
    # 32 KB here stops anything larger before it reaches web.
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 15s;
    send_timeout 30s;

    # Per-client rate limits (plan.md §8). One process, one host: the zones
    # are this nginx's own shared memory; no distributed limiter is needed.
    # An empty key is not counted, which is how one location applies a
    # different limit per method.
    map $request_method $read_key {
        GET     $binary_remote_addr;
        HEAD    $binary_remote_addr;
        default "";
    }
    map $request_method $write_key {
        GET     "";
        HEAD    "";
        default $binary_remote_addr;
    }
    limit_req_zone $binary_remote_addr zone=agent_turns:10m rate=10r/m;
    limit_req_zone $write_key          zone=orders:10m      rate=5r/m;
    limit_req_zone $write_key          zone=writes:10m      rate=60r/m;
    limit_req_zone $read_key           zone=reads:10m       rate=300r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream web {
        server web:3000;
        keepalive 16;
    }

    # Forwarded to web with every proxied request.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    # Above web's 30 s agent-turn timeout, so web answers first.
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        # Mounted from TLS_CERT_DIR (compose.prod.yaml); never in the repository.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # HSTS, CSP and the other security headers come from web itself
        # (apps/web/src/lib/security/headers.ts), so they are not repeated.

        # A 429 in the APIs' own error shape, so apps/web shows its
        # rate-limit copy (userMessages.ts).
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Retry later."}';
        }

        # The most expensive request: one agent turn.
        location ~* ^/api/ai/v1/agent/turns/?$ {
            limit_req zone=agent_turns burst=5 nodelay;
            proxy_pass http://web;
        }

        # Order placement (POST only; the key is empty for other methods).
        location ~* ^/api/commerce/v1/orders/?$ {
            limit_req zone=orders burst=2 nodelay;
            limit_req zone=reads burst=50 nodelay;
            proxy_pass http://web;
        }

        # Every other API path: cart writes, reads, and web's /api/health.
        location ~* ^/api/ {
            limit_req zone=writes burst=20 nodelay;
            limit_req zone=reads burst=50 nodelay;
            proxy_pass http://web;
        }

        # Hashed build assets: immutable, and many per page view, so not
        # rate limited.
        location ^~ /_next/static/ {
            proxy_pass http://web;
        }

        # Pages. Each server-rendered menu view reads commerce-api.
        location / {
            limit_req zone=reads burst=50 nodelay;
            proxy_pass http://web;
        }
    }
}
